services:
  - type: static
    name: car-rental-frontend
    repo: https://github.com/<your-github-username>/CAR-RENTAL-APP
    branch: main
    root: frontend
    publish_root: .
    build_command: node render/write-env.js
    env:
      # Replace with the public API URL of your backend service. This value is public
      # because it will be baked into the frontend during the build step.
      API_URL: "https://your-backend-domain.onrender.com"
